  <text x="693" y="782" text-anchor="middle" font-size="8" fill="#888">distancias y tipos de plan</text>

  <text x="460" y="818" text-anchor="middle" font-size="10" fill="#9b2c2c">policy elige objetivo  -  command.py emite BrakeCommand</text>

  <rect x="120" y="832" width="680" height="36" rx="6" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="460" y="854" text-anchor="middle" font-size="11" font-weight="600" fill="#9b2c2c">BrakeCommand -&gt; handle_controller (notch) -&gt; tsw_ipc_bus -&gt; main.lua</text>

  <text x="460" y="888" text-anchor="middle" font-size="9" fill="#888">archive/braking_v1/ ya no se usa</text>

  <!-- feedback loop to juego -->
  <path d="M 740 548 L 860 548 L 860 88 L 610 88" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#a2)"/>
  <text x="872" y="320" font-size="9" fill="#2b6cb0" transform="rotate(90 872 320)">vuelta al juego</text>

  <!-- legend -->
  <rect x="40" y="960" width="840" height="100" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="984" font-size="11" font-weight="700">Lectura del mapa</text>
  <text x="60" y="1004" font-size="10" fill="#444">Arriba-abajo = flujo principal. Tres columnas = quien decide / ejecuta / escribe al juego.</text>
  <text x="60" y="1022" font-size="10" fill="#c53030">Caja roja = frenado P1 v2 (ruta de mandos de freno).</text>
  <text x="60" y="1040" font-size="10" fill="#2b6cb0">Linea punteada = respuesta IPC al mod Lua.</text>
  <text x="500" y="1040" font-size="10" fill="#666">TSW6 - docs/FLUJO_FRENOS.md</text>
