  <text x="700" y="574" text-anchor="middle" font-size="9" fill="#666">nombres del paquete</text>

  <line x1="480" y1="580" x2="480" y2="596" stroke="#333" stroke-width="1.5"/>
  <rect x="200" y="596" width="560" height="48" rx="6" fill="#c6f6d5" stroke="#38a169"/>
  <text x="480" y="616" text-anchor="middle" font-size="11" font-weight="600">physics.py - s = v^2/(2a)</text>
  <text x="480" y="632" text-anchor="middle" font-size="9" fill="#666">gradiente probe | learner a | massFactor* HTTP</text>

  <line x1="480" y1="644" x2="480" y2="660" stroke="#c53030" stroke-width="2"/>
  <rect x="60" y="660" width="840" height="100" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="480" y="682" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">P1 coordinator</text>
