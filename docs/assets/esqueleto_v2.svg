  <text x="180" y="730" text-anchor="middle" font-size="8" fill="#666">1 cartel | C.3a odo</text>
  <rect x="290" y="692" width="180" height="52" rx="6" fill="#fff" stroke="#fc8181"/>
  <text x="380" y="714" text-anchor="middle" font-size="10">station_plan</text>
