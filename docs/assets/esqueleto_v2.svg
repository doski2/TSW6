  <!-- notas pie -->
  <text x="480" y="1070" text-anchor="middle" font-size="10" fill="#444">Flujo: UE -&gt; Probe -&gt; GetData -&gt; TrainState -&gt; G-A/G-B -&gt; physics -&gt; P1 -&gt; IPC -&gt; Probe -&gt; UE</text>
  <text x="480" y="1090" text-anchor="middle" font-size="9" fill="#666">Ahorro v2 = cache palanca (paquete G-B). No ahorro = v^2/2a cada tick.</text>
  <text x="480" y="1110" text-anchor="middle" font-size="9" fill="#666">Campo nuevo = contrato GetData (D2) + F9 + tests (D7) - no if suelto en Lua.</text>
</svg>
